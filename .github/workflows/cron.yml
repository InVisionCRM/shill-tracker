name: Cron

on:
  schedule:
    # Hourly, not every 30 minutes: each tick wakes the free Neon compute, which has
    # 100 CU-hours a month. Overrunning that quota took the database offline from Oct 29.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Price queue, and scores on the hour
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          base="${APP_URL%/}"
          out=$(curl --fail-with-body -sS --max-time 58 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/cron/prices") || { echo "$out" | head -c 2000; echo; echo "price job failed"; exit 1; }
          # Vercel's login page answers 200, so require the job's JSON, not just a 2xx.
          echo "$out" | head -c 2000
          echo "$out" | grep -q '"ok":true' || { echo "price job did not return ok:true"; exit 1; }
          # Price now for every priced first call, one quote per token.
          now=$(curl --fail-with-body -sS --max-time 58 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/cron/now-prices") || { echo "$now" | head -c 1000; echo; echo "now-price refresh failed"; exit 1; }
          echo "$now" | head -c 1000
          echo "$now" | grep -q '"ok":true' || { echo "now-price refresh did not return ok:true"; exit 1; }
          # Even 30-minute buckets of the Unix epoch are the :00 UTC hour.
          # A manual run always refreshes scores. Half-hour schedule ticks do not.
          bucket=$(( $(date -u +%s) / 1800 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((bucket % 2)) -eq 0 ]; then
            curl --fail-with-body -sS --max-time 15 -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${base}/api/cron/scores"
          fi
